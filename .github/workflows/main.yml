name: Daily JustDoWork Login

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）运行一次
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Debug info
        run: |
          echo "UTC now: $(date -u --rfc-3339=seconds)"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "Run started at: ${{ github.run_started_at }}"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            echo "--- event payload ---"
            cat "$GITHUB_EVENT_PATH" || true
            echo "--- end payload ---"
          fi

      - name: Run login script
        env:
          JUSTWOKER_COOKIES: ${{ secrets.JUSTWOKER_COOKIES }}
        run: python login.py

      - name: Upload screenshot (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshot
          path: after_login.png
          if-no-files-found: ignore

      # ---------- 保活：自动创建并推送到 keepalive 分支 ----------
      - name: Keepalive commit
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 尝试切到 keepalive 分支：存在就 checkout，不存在就新建孤儿分支
          if git ls-remote --exit-code --heads "$REMOTE_URL" keepalive > /dev/null 2>&1; then
            echo "keepalive 分支已存在，切换过去"
            git fetch origin keepalive
            git checkout keepalive
          else
            echo "keepalive 分支不存在，创建孤儿分支"
            git checkout --orphan keepalive
            git rm -rf . || true
            echo "# keepalive" > README.md
            git add README.md
            git commit -m "init keepalive branch"
          fi

          # 写时间戳并推送
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "keepalive $(date -u +%Y-%m-%d)" || echo "no change to commit"
          git push -u origin keepalive
