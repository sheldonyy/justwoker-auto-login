name: Daily JustDoWork Login

on:
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）运行一次
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run login script
        env:
          JUSTWOKER_COOKIES: ${{ secrets.JUSTWOKER_COOKIES }}
        run: python login.py

      - name: Upload screenshot (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshot
          path: after_login.png
          if-no-files-found: ignore

      - name: Keepalive commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "keepalive $(date -u +%Y-%m-%d)" || echo "no change"
          git push